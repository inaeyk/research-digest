[build-system]
requires = []
build-backend = "_research_digest_build"
backend-path = ["."]

[project]
name = "research-digest"
version = "0.2.0"
description = "A personal research-information extractor MVP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.99.0",
  "streamlit>=1.51.0",
]

[project.scripts]
research-digest = "research_digest.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openai", "openai.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true
follow_imports = "skip"
